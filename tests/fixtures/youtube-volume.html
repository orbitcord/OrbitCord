<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Compact YouTube volume control regression</title>
    <style>
        /* Relevant geometry from YouTube's compact vertical-volume player.
           The bottom bar is painted later at the same stacking level. */
        body { margin: 0; width: 480px; height: 270px; background: #202020; }
        video { position: absolute; inset: 0; width: 480px; height: 270px; }
        .player-controls-top { position: absolute; left: 14px; top: 0; width: 442px; height: 52px; z-index: 2; }
        .player-controls-top-right { margin-left: 298px; }
        .ytdVolumeControlsHost { display: flex; max-height: 48px; }
        .ytdVolumeControlsVolumeControlsContainer { display: flex; align-items: center; position: relative; flex: 1 1 auto; }
        .ytdVolumeControlsVolumeControlsContainerVertical { max-width: 48px; width: 48px; flex-direction: column; justify-content: flex-start; gap: 60px; height: fit-content; pointer-events: none; }
        .ytdVolumeControlsVolumeControlsContainerExpanded { pointer-events: all; }
        .ytdVolumeControlsMuteIconButtonContainer { display: flex; width: 48px; height: 48px; flex-shrink: 0; }
        .ytdVolumeControlsMuteIconButton { width: 48px; height: 48px; pointer-events: all; }
        .ytdVolumeControlsSliderContainer { display: flex; justify-content: center; align-items: center; width: 0; opacity: 0; overflow: hidden; visibility: hidden; }
        .ytdVolumeControlsSliderContainerExpanded { visibility: visible; opacity: 1; z-index: 1; }
        .ytdVolumeControlsSliderContainerVertical { height: 48px; min-height: 48px; padding: 0 12px; background: #555; border-radius: 50px; }
        .ytdVolumeControlsSliderContainerVerticalDown { transform: rotate(270deg); }
        .ytdVolumeControlsSliderContainerVerticalExpanded { margin-top: 8px; width: 133px; }
        .ytdVolumeControlsNativeSlider { margin: 0; min-width: 0; width: 100%; }
        .player-controls-bottom { position: absolute; left: 12px; top: 144px; width: 390px; height: 44px; z-index: 2; }
    </style>
</head>
<body>
    <video></video>
    <div id="player-controls">
        <div class="player-controls-top"><div class="player-controls-top-right">
            <volume-controls class="ytdVolumeControlsHost">
                <div class="ytdVolumeControlsVolumeControlsContainer ytdVolumeControlsVolumeControlsContainerVertical">
                    <div class="ytdVolumeControlsMuteIconButtonContainer"><button class="ytdVolumeControlsMuteIconButton" aria-label="Mute">Mute</button></div>
                    <div class="ytdVolumeControlsSliderContainer ytdVolumeControlsSliderContainerVertical ytdVolumeControlsSliderContainerVerticalDown">
                        <input class="ytdVolumeControlsNativeSlider" type="range" min="0" max="100" value="50" aria-label="Volume">
                    </div>
                </div>
            </volume-controls>
        </div></div>
        <div class="player-controls-bottom"></div>
    </div>
    <script>
        const container = document.querySelector('.ytdVolumeControlsVolumeControlsContainer');
        const slider = document.querySelector('.ytdVolumeControlsSliderContainer');
        container.addEventListener('mouseenter', () => {
            container.classList.add('ytdVolumeControlsVolumeControlsContainerExpanded');
            slider.classList.add('ytdVolumeControlsSliderContainerExpanded', 'ytdVolumeControlsSliderContainerVerticalExpanded');
        });
        container.addEventListener('mouseleave', () => {
            container.classList.remove('ytdVolumeControlsVolumeControlsContainerExpanded');
            slider.classList.remove('ytdVolumeControlsSliderContainerExpanded', 'ytdVolumeControlsSliderContainerVerticalExpanded');
        });
        document.querySelector('input').addEventListener('input', event => {
            document.querySelector('video').volume = Number(event.target.value) / 100;
        });
    </script>
</body>
</html>
