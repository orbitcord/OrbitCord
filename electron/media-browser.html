<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; base-uri 'none'; form-action 'none'">
<title>Media source website — OrbitCord</title><link rel="stylesheet" href="media-browser.css"><script src="media-browser.js" defer></script></head>
<body>
<header>
 <form id="navigation">
  <button id="back" type="button" class="icon" aria-label="Back" title="Back">‹</button><button id="forward" type="button" class="icon" aria-label="Forward" title="Forward">›</button><button id="reload" type="button" class="icon" aria-label="Reload" title="Reload">↻</button>
  <select id="source" aria-label="Media source"></select>
  <input id="address" aria-label="Source address" type="url" spellcheck="false"><button id="go" type="submit" hidden>Go</button>
  <button id="save" type="button">Save page</button><select id="saved" aria-label="Saved pages"><option value="">Saved pages</option></select><button id="logout" type="button">Sign out</button>
  <button id="picker" type="button">Back to picker</button>
 </form>
</header>
<footer><span id="destination"></span><span id="status" role="status" aria-live="polite">Opening source…</span><button id="cancel" hidden>Cancel</button></footer>
</body></html>
