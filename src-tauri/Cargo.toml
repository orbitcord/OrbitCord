[package]
name = "lowcord-native"
version = "0.1.0"
description = "OrbitCord Rust native backend"
edition = "2021"
rust-version = "1.95"
license = "GPL-3.0-or-later"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify-rust = "=4.18.0"
open = "=5.4.4"
url = "=2.5.8"

[profile.release]
lto = true
codegen-units = 1
opt-level = "s"
strip = true
panic = "abort"
