name: Build and publish release

on:
  push:
    branches: [main]
    paths: [package.json]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: orbitcord-release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.release.outputs.version }}
      publish: ${{ steps.release.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
      - id: release
        uses: actions/github-script@v7
        with:
          script: |
            const { version } = require('./package.json');
            if (!/^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/.test(version))
              throw new Error('Release version must be a three-part stable version: ' + version);
            const tag = 'v' + version;
            if (context.ref.startsWith('refs/tags/') && context.ref !== 'refs/tags/' + tag)
              throw new Error('Tag ' + context.ref + ' does not match package version ' + version);
            let published = false;
            try {
              const { data } = await github.rest.repos.getReleaseByTag({ ...context.repo, tag });
              published = !data.draft;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            if (!published) {
              try {
                const { data } = await github.rest.repos.getLatestRelease(context.repo);
                const previous = /^v?(\d+)\.(\d+)\.(\d+)/.exec(data.tag_name);
                if (previous) {
                  const next = version.split('.').map(Number);
                  const old = previous.slice(1).map(Number);
                  const difference = next.map((part, i) => part - old[i]).find(part => part !== 0);
                  if (!(difference > 0)) throw new Error('Version ' + version + ' must be newer than ' + data.tag_name);
                }
              } catch (error) {
                if (error.status !== 404) throw error;
              }
            }
            core.setOutput('version', version);
            core.setOutput('publish', String(!published));
            if (published) core.info(tag + ' is already published; bump package.json to release a new version.');

  build:
    needs: prepare
    if: needs.prepare.outputs.publish == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: macos
          - os: windows-latest
            platform: windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install universal Mac Rust targets
        if: matrix.platform == 'macos'
        run: rustup target add x86_64-apple-darwin aarch64-apple-darwin
      - run: pnpm install --frozen-lockfile
      - name: Verify update checks and release manifest validation
        run: pnpm test:updates
      - name: Verify media, fullscreen and update settings on the release platform
        run: node node_modules/@playwright/test/cli.js test --config playwright.electron.config.mjs --grep "decodes|fullscreen|file-backed|downloaded update|settings checks updates"
      - if: matrix.platform == 'macos'
        run: pnpm build:mac
      - if: matrix.platform == 'windows'
        run: pnpm build
      - if: matrix.platform == 'windows'
        run: node scripts/update-manifest.mjs
      - uses: actions/upload-artifact@v4
        if: matrix.platform == 'macos'
        with:
          name: release-${{ matrix.platform }}
          path: dist/*.dmg
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: matrix.platform == 'windows'
        with:
          name: release-${{ matrix.platform }}
          path: |
            dist/*.exe
            dist/*.blockmap
            dist/latest.yml
            dist/1.yml
          if-no-files-found: error

  publish:
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-files
          merge-multiple: true
      - name: Validate both installers, versions and update checksums before publication
        run: node scripts/release-assets.mjs release-files
      - name: Publish the stable release and legacy Windows update bridge
        shell: bash
        run: |
          set -euo pipefail
          TAG="v$VERSION"
          BRIDGE="$TAG-1"
          EXE="release-files/OrbitCord-$VERSION-windows-x64-Setup.exe"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --draft --target "$GITHUB_SHA" --title "OrbitCord $VERSION" --generate-notes
          fi
          gh release upload "$TAG" release-files/* --clobber
          if ! gh release view "$BRIDGE" >/dev/null 2>&1; then
            gh release create "$BRIDGE" --draft --prerelease --target "$GITHUB_SHA" \
              --title "OrbitCord $VERSION — legacy Windows update bridge" \
              --notes "Compatibility feed for Windows 0.1.5.1 installations. The installer is the stable OrbitCord $VERSION build. New installations should use the stable release."
          fi
          gh release upload "$BRIDGE" "$EXE" "$EXE.blockmap" release-files/1.yml release-files/latest.yml --clobber
          gh release edit "$BRIDGE" --draft=false --prerelease
          gh release edit "$TAG" --draft=false --prerelease=false --latest
