name: Build and publish release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: macos
          - os: windows-latest
            platform: windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install universal Mac Rust targets
        if: matrix.platform == 'macos'
        run: rustup target add x86_64-apple-darwin aarch64-apple-darwin
      - name: Check release tag matches app version
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VERSION="$(node -p "require('./package.json').version")"
          test "$TAG" = "$VERSION" || { echo "Tag v$TAG does not match package version $VERSION"; exit 1; }
      - run: pnpm install --frozen-lockfile
      - name: Verify media decoding and fullscreen on the release platform
        run: node node_modules/@playwright/test/cli.js test --config playwright.electron.config.mjs --grep "decodes|fullscreen|file-backed"
      - if: matrix.platform == 'macos'
        run: pnpm build:mac
      - if: matrix.platform == 'windows'
        run: pnpm build
      - if: matrix.platform == 'windows'
        run: pnpm exec node scripts/update-manifest.mjs
      - uses: actions/upload-artifact@v4
        if: matrix.platform == 'macos'
        with:
          name: release-${{ matrix.platform }}
          path: dist/*.dmg
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: matrix.platform == 'windows'
        with:
          name: release-${{ matrix.platform }}
          path: |
            dist/*.exe
            dist/*.blockmap
            dist/latest.yml
          if-no-files-found: error
  publish:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-files
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: release-files/*
          draft: false
          generate_release_notes: true
